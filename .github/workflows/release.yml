name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vscode_version:
        description: "Upstream VS Code tag (e.g. 1.99.1). Defaults to latest stable."
        required: false
        type: string
      pre_release:
        description: "Mark the release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build ${{ matrix.platform }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: darwin
            arch: x64
            runner: macos-latest
          - platform: win32
            arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve versions
        id: versions
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.vscode_version }}" ]; then
            echo "vscode=${{ github.event.inputs.vscode_version }}" >> "$GITHUB_OUTPUT"
          else
            tag="$(curl -fsSL https://api.github.com/repos/microsoft/vscode/releases/latest | grep -m1 '"tag_name"' | sed 's/.*: "//; s/",//')"
            echo "vscode=$tag" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "picket=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "picket=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare, build and package
        shell: bash
        run: |
          bash build/prepare.sh "${{ steps.versions.outputs.vscode }}" \
            "${{ steps.versions.outputs.picket }}" \
            "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picket-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            picket-*.tar.gz
            picket-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
          generate_release_notes: true
