name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vscode_version:
        description: "Upstream VS Code tag (e.g. 1.142.0). Defaults to latest stable."
        required: false
        type: string
      pre_release:
        description: "Mark the release as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: "Build ${{ matrix.platform }}-${{ matrix.arch }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          # MVP scope: Linux + Windows (x64). macOS planned after P0 validation.
          - platform: linux
            arch: x64
            runner: ubuntu-latest
          - platform: win32
            arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve versions (vscode tag, node from upstream .nvmrc)
        id: versions
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.vscode_version }}" ]; then
            VSCODE_TAG="${{ github.event.inputs.vscode_version }}"
          else
            VSCODE_TAG="$(curl -fsSL https://api.github.com/repos/microsoft/vscode/releases/latest | python3 -c 'import sys,json;print(json.load(sys.stdin)["tag_name"])')"
          fi
          VSCODE_TAG="$(printf '%s' "$VSCODE_TAG" | tr -d '[:space:]')"
          echo "vscode=$VSCODE_TAG" >> "$GITHUB_OUTPUT"
          NODE_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/$VSCODE_TAG/.nvmrc" | tr -d '[:space:]')"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "picket=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "picket=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbfile-dev libsecret-1-dev libnss3 libgtk-3-0

      - name: Prepare, build and package
        shell: bash
        run: |
          bash build/prepare.sh "${{ steps.versions.outputs.vscode }}" \
            "${{ steps.versions.outputs.picket }}" \
            "${{ matrix.platform }}" "${{ matrix.arch }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: picket-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            picket-*.tar.gz
            picket-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**
          prerelease: ${{ github.event.inputs.pre_release == 'true' }}
          generate_release_notes: true
